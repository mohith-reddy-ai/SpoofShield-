<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Scanner</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">SpoofShield</div>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="dns-scanner.html">DNS Scanner</a></li>
                <li><a href="email-analyzer.html">Email Analyzer</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="scanner-form">
            <h2>Scan DNS</h2>
            <form id="dnsForm">
                <label for="domainInput">Enter Domain:</label>
                <input type="text" id="domainInput" name="domain" required>
                <button type="submit" class="scan-button">Scan</button>
            </form>
        </section>

        <section class="dns-results">
            <h2>DNS Record Results</h2>
            <div id="dnsOutput">
                <!-- Results will appear here -->
            </div>
        </section>

        <section class="risk-score">
            <h2>Risk Score</h2>
            <div id="riskScore">
                <!-- Risk Score will appear here -->
            </div>
        </section>

        <section class="evidence">
            <h2>Evidence</h2>
            <div id="evidenceOutput">
                <!-- Evidence will appear here -->
            </div>
        </section>

        <section class="error-messages">
            <h2>Error Messages</h2>
            <div id="errorOutput">
                <!-- Error Messages will appear here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SpoofShield. All rights reserved.</p>
    </footer>

    <script src="assets/js/dns-scanner.js"></script>
</body>
</html>
